<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="saathi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="saathi-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#CCFBF1" />
    </linearGradient>
    <filter id="saathi-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0D9488" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(6, 6)" filter="url(#saathi-shadow)">
    <!-- Rounded Outer Badge -->
    <rect width="68" height="68" rx="20" fill="url(#saathi-grad)" />
    
    <!-- Subtle Inner Glow Border -->
    <rect x="1.5" y="1.5" width="65" height="65" rx="18.5" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" />
    
    <!-- Generational Heart & Hands Icon Motif -->
    <g transform="translate(14, 13)">
      <!-- Hands holding / Heart embrace -->
      <path d="M20 37.5C20 37.5 5 27 5 16C5 9.5 10 5 16 5C18.8 5 21.5 6.4 23 8.8C24.5 6.4 27.2 5 30 5C36 5 41 9.5 41 16C41 27 26 37.5 26 37.5L23 40L20 37.5Z" 
            fill="#FFFFFF" fill-opacity="0.22" />
      
      <!-- Intertwined Companionship Figures (Elder + Youth) -->
      <!-- Elder Head with traditional warmth -->
      <circle cx="16" cy="14" r="5" fill="#FFFFFF" />
      <path d="M10 28C10 23.5 13 21 16 21C18.5 21 21 22.8 21.7 25.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Youth Companion Head (leaning in with care) -->
      <circle cx="28" cy="12" r="4.5" fill="#E0F2FE" />
      <path d="M22 26C23 22 25.5 19 28 19C31 19 34 21.5 34 26" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" fill="none" />

      <!-- Interlocked Heart Hands / Bond Arc -->
      <path d="M12 33C16 36 24 37 30 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
      
      <!-- Small Spark / Sun Motif of Joy -->
      <circle cx="34" cy="7" r="2" fill="#38BDF8" />
      <path d="M34 2V4M37.5 3.5L36 5M39 7H37" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 14)">
    <!-- "साथी" Devanagari Script -->
    <text x="0" y="32" font-family="'Noto Sans Devanagari', 'Baloo 2', system-ui, sans-serif" font-weight="900" font-size="34" fill="#0F172A" letter-spacing="-0.5">साथी</text>
    
    <!-- "Saathi" English Script -->
    <text x="76" y="31" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#0D9488" letter-spacing="-0.5">Saathi</text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="50" font-family="'Inter', 'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#64748B" letter-spacing="0.8">CONNECTED SENIOR CARE ECOSYSTEM</text>
  </g>
</svg>
